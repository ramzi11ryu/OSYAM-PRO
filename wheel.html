<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Real TV Rotate</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
</style>

</head>

<body>

<script>

/* Scene */
const scene=new THREE.Scene();

/* Camera */
const camera=new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,2,12);

/* Renderer */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Lighting */
scene.add(new THREE.AmbientLight(0xffffff,0.8));

const light=new THREE.PointLight(0xffd700,1.5);
light.position.set(10,8,10);
scene.add(light);

/* Realistic TV Shape */

const tvGeo=new THREE.BoxGeometry(6,3.5,0.7);

const tvMat=new THREE.MeshStandardMaterial({
color:0x333333,
metalness:0.7,
roughness:0.3
});

const tv=new THREE.Mesh(tvGeo,tvMat);
scene.add(tv);

/* Screen */

const canvas=document.createElement("canvas");
canvas.width=512;
canvas.height=512;

const ctx=canvas.getContext("2d");

function drawScreen(){

ctx.fillStyle="black";
ctx.fillRect(0,0,512,512);

ctx.fillStyle="#00ffcc";
ctx.font="bold 120px Arial";
ctx.textAlign="center";

ctx.fillText("OSYAM PRO",256,300);

}

const texture=new THREE.CanvasTexture(canvas);

/* Screen inside TV */

const screenGeo=new THREE.PlaneGeometry(5.5,3.1);

const screenMat=new THREE.MeshBasicMaterial({
map:texture
});

const screen=new THREE.Mesh(screenGeo,screenMat);
screen.position.z=0.36;

tv.add(screen);

/* Rotation TV */

function animate(){

requestAnimationFrame(animate);

tv.rotation.y+=0.002;

renderer.render(scene,camera);
}

drawScreen();
animate();

/* Resize */

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>

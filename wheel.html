<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>عجلة الحظ - DZ GEMS</title>

<style>
html, body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Arial, sans-serif;
color:#00ffcc;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.video-bg iframe{
position:absolute;
top:50%;
left:50%;
width:177.77vh;
height:100vw;
min-width:177.77vw;
min-height:100vh;
transform:translate(-50%,-50%);
pointer-events:none;
}

#balanceDisplay{
font-size:18px;
margin-bottom:15px;
}

.container{
position:relative;
text-align:center;
}

canvas{
width:85vw;
height:85vw;
max-width:450px;
max-height:450px;
border-radius:50%;
background:rgba(0,0,0,.3);
}

#arrow{
position:absolute;
top:0;
left:50%;
transform:translate(-50%,-50%);
width:0;
height:0;
border-left:20px solid transparent;
border-right:20px solid transparent;
border-top:30px solid red;
z-index:10;
}

#spinBtn{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#10b981;
color:#fff;
font-weight:bold;
cursor:pointer;
}

#spinBtn:disabled{
opacity:.4;
cursor:not-allowed;
}
</style>
</head>

<body>

<div class="video-bg">
<iframe src="https://www.youtube.com/embed/Ma34Kr-GoAs?autoplay=1&mute=1&loop=1&playlist=Ma34Kr-GoAs&controls=0"
allowfullscreen></iframe>
</div>

<div id="balanceDisplay">الرصيد: 0 دج</div>

<div class="container">
<div id="arrow"></div>
<canvas id="wheel"></canvas>
<button id="spinBtn" disabled>دور العجلة 🎡</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_PROJECT",
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let center;
let radius;

function resizeCanvas(){
let size = Math.min(window.innerWidth*0.85,450);
canvas.width=size;
canvas.height=size;
center=size/2;
radius=center-10;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const spinBtn=document.getElementById("spinBtn");

let prizes=[1000,200,10,3000,50,10,2000,70,30,10,0,150,60,40,5000,250,0,10];
const slice=2*Math.PI/prizes.length;

let angle=0;
let spinning=false;

function drawWheel(){
ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<prizes.length;i++){

let start=angle+i*slice-Math.PI/2;

ctx.beginPath();
ctx.moveTo(center,center);
ctx.arc(center,center,center,start,start+slice);

ctx.fillStyle=i%2?"rgba(37,99,235,.6)":"rgba(0,0,0,.3)";
ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(start+slice/2);

ctx.fillStyle="#fff";
ctx.font="bold 14px Arial";
ctx.textAlign="right";
ctx.fillText(prizes[i]+" دج",center-20,5);

ctx.restore();
}
}

spinBtn.onclick=function(){
if(spinning) return;

spinning=true;

let velocity=0.4+Math.random()*0.2;
let friction=0.985;

function spinStep(){

angle+=velocity;
drawWheel();

velocity*=friction;

if(velocity<0.005){
spinning=false;
alert("🎉 انتهى الدوران");
return;
}

requestAnimationFrame(spinStep);
}

requestAnimationFrame(spinStep);
};

(function loop(){
drawWheel();
requestAnimationFrame(loop);
})();

</script>

<script>
function openOverlay(){
document.getElementById("overlay").style.display="flex";
}
</script>

</body>
</html>
